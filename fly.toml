# fly.toml app configuration file generated for dueclock on 2026-11-10T22:28:34+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dueclock'
primary_region = 'nrt'    # Tokyo: Fly has no Seoul region; Tokyo is the closest to the Supabase database (ap-northeast-2)

[build]
[env]
  # DUECLOCK_PUBLIC_URL, the two database URLs, PGPASSWORD, DUECLOCK_TOKEN_SECRET and WhatsApp values are SECRETS: `fly secrets set ...`
  DUECLOCK_ENV = 'production'
  DUECLOCK_SCHEDULER = '1'
  DUECLOCK_SCHEDULER_MINUTES = '60'
  DUECLOCK_TRUST_PROXY = '1'
  PORT = '10000'

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/v1/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
